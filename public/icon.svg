<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e70ff"/>
      <stop offset="50%" stop-color="#0b57e8"/>
      <stop offset="100%" stop-color="#0043c7"/>
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>

    <!-- Book Page Gradient Left -->
    <linearGradient id="pageLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Book Page Gradient Right -->
    <linearGradient id="pageRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#004fc4"/>
      <stop offset="100%" stop-color="#002d7a"/>
    </linearGradient>

    <!-- Pencil Body Gradients -->
    <linearGradient id="pencilLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="pencilMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="pencilDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Pencil Eraser Gradient -->
    <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Pencil Metal Band Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Wood Tip Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Green Check Badge Gradient -->
    <linearGradient id="greenBadgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Green Bubble Gradient -->
    <linearGradient id="greenBubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="paperShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#001f5c" flood-opacity="0.35"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#001833" flood-opacity="0.38"/>
    </filter>

    <filter id="pencilShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="14" stdDeviation="10" flood-color="#001a4e" flood-opacity="0.3"/>
    </filter>

    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#00153d" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#ambientGlow)"/>

  <!-- ==================== OPEN BOOK BASE ==================== -->
  <g filter="url(#bookShadow)">
    <!-- Book Hardcover Base (Deep Blue) -->
    <path d="M 60 440 C 150 442 220 452 256 462 C 292 452 362 442 452 440 C 462 440 470 448 470 458 C 470 464 466 470 458 472 C 370 484 286 484 256 490 C 226 484 142 484 54 472 C 46 470 42 464 42 458 C 42 448 50 440 60 440 Z" fill="url(#bookCoverGrad)"/>
    
    <!-- Book Spine Rim (Navy) -->
    <path d="M 246 455 C 252 453 260 453 266 455 L 266 485 C 260 487 252 487 246 485 Z" fill="#002157"/>

    <!-- Left Open Page (Curved 3D) -->
    <path d="M 68 432 C 140 424 216 432 254 444 L 254 365 C 216 355 140 348 68 358 Z" fill="url(#pageLeft)"/>
    <!-- Left Page Layers (Stacked edges) -->
    <path d="M 68 358 C 66 385 66 410 68 432 C 140 424 216 432 254 444 L 254 438 C 218 427 142 419 72 427 Z" fill="#cbd5e1" opacity="0.6"/>

    <!-- Right Open Page (Curved 3D) -->
    <path d="M 258 444 C 296 432 372 424 444 432 L 444 358 C 372 348 296 355 258 365 Z" fill="url(#pageRight)"/>
    <!-- Right Page Layers -->
    <path d="M 444 358 C 446 385 446 410 444 432 C 372 424 296 432 258 444 L 258 438 C 294 427 370 419 440 427 Z" fill="#cbd5e1" opacity="0.6"/>

    <!-- Center Fold Shadow -->
    <path d="M 253 365 C 255 365 257 365 259 365 L 258 446 C 256 446 254 446 253 446 Z" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- ==================== MAIN TEST PAPER (PYQ DOCUMENT) ==================== -->
  <g filter="url(#paperShadow)">
    <!-- White Paper Sheet (Slightly curved/rounded corners) -->
    <path d="M 124 50 C 104 50 90 64 90 84 L 90 376 C 90 392 102 404 118 404 C 180 396 230 408 256 422 C 282 408 332 396 394 404 C 410 404 422 392 422 376 L 422 170 C 422 166 420 162 418 158 L 334 56 C 330 52 324 50 318 50 Z" fill="url(#paperGrad)"/>
    <!-- Subtle Paper Border -->
    <path d="M 124 50 C 104 50 90 64 90 84 L 90 376 C 90 392 102 404 118 404 C 180 396 230 408 256 422 C 282 408 332 396 394 404 C 410 404 422 392 422 376 L 422 170 C 422 166 420 162 418 158 L 334 56 C 330 52 324 50 318 50 Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

    <!-- Paper Corner Fold Effect (Top Right) -->
    <path d="M 326 50 L 326 142 C 326 156 338 168 352 168 L 422 168 Z" fill="#e2e8f0" opacity="0.4"/>
    <path d="M 326 50 L 422 168 L 352 168 C 338 168 326 156 326 142 Z" fill="#f1f5f9"/>

    <!-- PYQ Title (Bold Navy Text) -->
    <text x="134" y="148" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="#0f2b5c" letter-spacing="-1">PYQ</text>

    <!-- Question Line 1 -->
    <g transform="translate(136, 192)">
      <!-- Circle with ? -->
      <circle cx="22" cy="22" r="21" fill="#ffffff" stroke="#94a3b8" stroke-width="4.5"/>
      <text x="22" y="30" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#94a3b8" text-anchor="middle">?</text>
      <!-- Horizontal Answer Line -->
      <rect x="62" y="15" width="180" height="14" rx="7" fill="#cbd5e1"/>
    </g>

    <!-- Question Line 2 -->
    <g transform="translate(136, 258)">
      <!-- Circle with ? -->
      <circle cx="22" cy="22" r="21" fill="#ffffff" stroke="#94a3b8" stroke-width="4.5"/>
      <text x="22" y="30" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#94a3b8" text-anchor="middle">?</text>
      <!-- Horizontal Answer Line -->
      <rect x="62" y="15" width="200" height="14" rx="7" fill="#cbd5e1"/>
    </g>

    <!-- Question Line 3 (Correct / Solved) -->
    <g transform="translate(136, 324)">
      <!-- Green Checkmark Circle -->
      <circle cx="22" cy="22" r="22" fill="url(#greenBubbleGrad)"/>
      <path d="M 13 22 L 19 28 L 31 16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Solved Answer Lines -->
      <rect x="62" y="10" width="160" height="14" rx="7" fill="#94a3b8"/>
      <rect x="62" y="34" width="105" height="12" rx="6" fill="#0284c7" opacity="0.85"/>
    </g>
  </g>

  <!-- ==================== 3D REALISTIC PENCIL ==================== -->
  <!-- Pencil tilted across right side -->
  <g transform="translate(366, 260) rotate(34)" filter="url(#pencilShadow)">
    <!-- Main Pencil Group -->
    <g transform="translate(-24, -145)">
      <!-- Eraser (Pink) -->
      <path d="M 8 0 C 8 -12 40 -12 40 0 L 40 32 L 8 32 Z" fill="url(#eraserGrad)"/>
      <!-- Eraser Highlight -->
      <path d="M 12 0 C 12 -8 24 -8 24 0 L 24 32 L 12 32 Z" fill="#ffffff" opacity="0.3"/>

      <!-- Metal Ferrule (Silver Band) -->
      <rect x="7" y="32" width="34" height="26" rx="2" fill="url(#metalGrad)"/>
      <!-- Ferrule grooves -->
      <line x1="7" y1="40" x2="41" y2="40" stroke="#64748b" stroke-width="1.5"/>
      <line x1="7" y1="48" x2="41" y2="48" stroke="#64748b" stroke-width="1.5"/>
      <rect x="12" y="32" width="8" height="26" fill="#ffffff" opacity="0.4"/>

      <!-- Hexagonal Pencil Body (3 visible facets) -->
      <!-- Left Facet (Light) -->
      <rect x="8" y="58" width="10" height="175" fill="url(#pencilLight)"/>
      <!-- Middle Facet (Mid) -->
      <rect x="18" y="58" width="14" height="175" fill="url(#pencilMid)"/>
      <!-- Right Facet (Dark) -->
      <rect x="32" y="58" width="8" height="175" fill="url(#pencilDark)"/>

      <!-- Sharpened Wood Cone -->
      <polygon points="8,233 40,233 24,285" fill="url(#woodGrad)"/>
      <!-- Wood facet cutouts -->
      <path d="M 8,233 Q 18,237 24,233 Q 32,237 40,233 L 24,285 Z" fill="url(#woodGrad)"/>

      <!-- Graphite Lead Cone Tip (Dark Slate) -->
      <polygon points="19,268 29,268 24,285" fill="#0f172a"/>
      <polygon points="19,268 24,268 24,285" fill="#334155"/>
    </g>
  </g>

  <!-- ==================== LARGE FLOATING GREEN CHECKMARK BADGE ==================== -->
  <g transform="translate(426, 420)" filter="url(#badgeShadow)">
    <!-- Outer White Ring -->
    <circle cx="0" cy="0" r="70" fill="#ffffff"/>

    <!-- Inner Green Gradient Sphere -->
    <circle cx="0" cy="0" r="60" fill="url(#greenBadgeGrad)"/>

    <!-- Subtle Top Gloss Curve -->
    <path d="M -48 -24 C -30 -50 30 -50 48 -24 C 20 -38 -20 -38 -48 -24 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Bold White Checkmark (3D styled) -->
    <path d="M -26 2 L -8 20 L 26 -16" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
